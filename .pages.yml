# Pages CMS 설정 — https://app.pagescms.org 에서 이 저장소를 열면 아래 편집 화면이 나타납니다.
media:
  input: public/images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: writing
    label: 글 (Writing)
    type: collection
    path: src/content/writing
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, category, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: slug
        label: 주소 (영문 소문자·하이픈, 예 pf-loan-structure)
        type: string
      - name: description
        label: 요약 (목록·검색·뉴스레터에 쓰임)
        type: text
      - name: date
        label: 발행일
        type: date
        required: true
      - name: category
        label: 카테고리
        type: select
        required: true
        options:
          values: [실무노트, AI, 에세이]
      - name: cover
        label: 대표 사진 (선택)
        type: image
      - name: draft
        label: 초안 (체크하면 사이트에 공개되지 않음)
        type: boolean
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  - name: work
    label: 작업 (Work)
    type: collection
    path: src/content/work
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, kind, date, draft]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: slug
        label: 주소 (영문 소문자·하이픈, 예 pf-loan-structure)
        type: string
      - name: kind
        label: 종류
        type: select
        required: true
        options:
          values: [음악, 사진, 영상]
      - name: date
        label: 날짜
        type: date
        required: true
      - name: description
        label: 한 줄 설명
        type: text
      - name: cover
        label: 대표 사진
        type: image
      - name: link
        label: 외부 링크 (SoundCloud·YouTube 등)
        type: string
      - name: draft
        label: 초안 (체크하면 사이트에 공개되지 않음)
        type: boolean
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  - name: home
    label: 홈 소개문
    type: file
    path: src/content/pages/home.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: (고정값 — 바꾸지 마십시오)
        type: string
        default: Home
      - name: tagline
        label: 첫 줄 문구
        type: string
      - name: body
        label: 소개 문단
        type: rich-text
        options:
          format: markdown

  - name: about
    label: About 페이지
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 페이지 제목
        type: string
      - name: description
        label: 검색 결과 설명문
        type: text
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
